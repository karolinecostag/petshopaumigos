<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Agendamento</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🐶 PetShop Aumigos</a>

            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicos.html">Serviços</a></li>
                    <li class="nav-item"><a class="nav-link" href="agendamento.html">Agendamento</a></li>
                    <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div style="margin-top: 80px;"></div> <!-- ESPAÇAMENTO PARA NÃO FICAR ATRÁS DA NAVBAR -->

    <main class="container mt-4">

        <h2>Agendamento de Serviços</h2>

        <form id="formAgendamento">

            <h4>Dados do Cliente</h4>

            <input type="text" placeholder="Nome completo" required class="form-control mb-2">

            <input type="text" placeholder="Endereço" required class="form-control mb-2">

            <input type="text" placeholder="CPF" required class="form-control mb-2">

            <input type="email" placeholder="E-mail" required class="form-control mb-2">

            <input type="tel" placeholder="Telefone" required class="form-control mb-2">

            <label>Sexo:</label><br>
            <input type="radio" name="sexo"> Feminino
            <input type="radio" name="sexo"> Masculino

            <hr>

            <h4>Dados do Pet</h4>

            <input type="text" placeholder="Nome do pet" required class="form-control mb-2">

            <input type="text" placeholder="Raça" class="form-control mb-2">

            <input type="number" placeholder="Idade" class="form-control mb-2">

            <hr>

            <h4>Serviço</h4>

            <input type="checkbox"> Banho <br>
            <input type="checkbox"> Tosa

            <hr>

            <h4>Agendamento</h4>

            <input type="date" required class="form-control mb-2">
            <input type="time" required class="form-control mb-2">

            <label>Tipo:</label><br>
            <input type="radio" name="tipo"> Tele-busca
            <input type="radio" name="tipo"> Levar no local

            <br><br>

            <button type="submit" class="btn btn-success">Agendar</button>

        </form>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
